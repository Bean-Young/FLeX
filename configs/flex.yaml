image_size: 224
batch_size: 8
threshold: 0.40

classes:
  benign: 0
  malignant: 1
  normal: 2

frequency_bands:
  # Fourier-grid radii for 224 x 224 inputs.
  low_mid_radius: 2
  mid_high_radius: 8

frequency_weights:
  low: 0.25
  mid: 0.50
  high: 0.25

lesion_support:
  kappa: 1.0
  eta_min: 0.50
  eta_max: 0.95
  delta: 0.05

adaptation:
  steps: 1
  lr: 0.0001
  rho_seg: 0.50
  rho_cls: 0.50

loss:
  lambda_src: 0.10
  lambda_pres: 0.50
  lambda_neg: 0.50
  beta_area: 1.0

output_safeguards:
  class_prior: null
  class_prior_strength: 1.0
  morphology_refinement: true
  min_component_area_ratio: 0.0005

reported_ablation_protocol:
  source: BrEaST
  backbone: UNet
  tta_targets: [BUS-UCLM, BUSI]
  ctta_stream: [BUSBRA_D1, BUSBRA_D2, BUSBRA_D3, BUSBRA_D4]
  prompt_designs:
    full_band: {prompt_mode: full}
    low_only: {prompt_mode: bands, frequency_weights: [1.0, 0.0, 0.0]}
    mid_only: {prompt_mode: bands, frequency_weights: [0.0, 1.0, 0.0]}
    high_only: {prompt_mode: bands, frequency_weights: [0.0, 0.0, 1.0]}
    equal_bands: {prompt_mode: bands, frequency_weights: [0.333333, 0.333333, 0.333333]}
    proposed_1_2_1: {prompt_mode: bands, frequency_weights: [0.25, 0.50, 0.25]}
